name: Test and build

# When does this run - new, reopened or updated PRs, pushes to main or develop and when
# the workflow is called by another workflow, such as the publishing actions.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main, develop]
  workflow_call:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    needs: qa
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: ["3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        pipx install poetry --python python${{ matrix.python-version }}
        poetry --version

    - name: Install dependencies
      run: poetry install

    - name: Run tests
      run: poetry run pytest --cov-report xml

    - name: Archive log for error checking on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: failed_tests_ve_run_cli_log
        path: ${{ runner.temp }}/log_file.log
        archive: false
        retention-days: 1

    - name: Upload coverage to Codecov
      if: >- 
          ${{ ! (
             github.event.pull_request.user.login == 'dependabot[bot]' || 
             github.event.pull_request.user.login == 'pre-commit-ci[bot]'
            ) && (
             matrix.os == 'ubuntu-latest' && 
             matrix.python-version == '3.12'
            )
          }}
      uses: codecov/codecov-action@v6
      with:
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
        verbose: true
  docs_build:
    needs: qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pipx install poetry --python python3.12
          poetry --version
      
      - name: Install dependencies
        run: poetry install

      - name: Build docs using sphinx
        run: |
          cd docs
          poetry run sphinx-build -W --keep-going source build
      
      - name: Archive built docs for error checking on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: built-docs
          path: docs/build
          retention-days: 2
