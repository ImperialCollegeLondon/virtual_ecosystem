[core.data_output_options]
save_initial_state = true
out_path = "/tmp/ve_example/out"
save_continuous_data = true
save_final_state = true
save_merged_config = true
out_initial_file_name = "initial_state.nc"
out_continuous_file_name = "all_continuous_data.nc"
out_final_file_name = "final_state.nc"
out_merge_file_name = "ve_full_model_configuration.toml"

[core.grid]
grid_type = "square"
cell_area = 8100
cell_nx = 9
cell_ny = 9
xoff = -45.0
yoff = -45.0

[core.timing]
start_date = "2013-01-01"
update_interval = "1 month"
run_length = "2 years"

[core.layers]
soil_layers = [
    -0.25,
    -1.0,
]
canopy_layers = 10
above_canopy_height_offset = 2.0
surface_layer_height = 0.1
subcanopy_layer_height = 1.5

[hydrology]
initial_soil_moisture = 0.5
initial_groundwater_saturation = 0.9
static = false

[abiotic_simple]
static = false

[animal]
functional_group_definitions_path = "/private/tmp/ve_example/data/animal_functional_groups.csv"
static = false
density_scaling_method = "madingley"

[litter]
static = false

[plants]
cohort_data_path = "/private/tmp/ve_example/data/example_plant_cohorts.csv"
pft_definitions_path = "/private/tmp/ve_example/data/plant_pfts.csv"
static = false

[plants.community_data_export]
required_data = []
cohort_attributes = []
community_canopy_attributes = []
stem_canopy_attributes = []
float_format = "%0.5f"
